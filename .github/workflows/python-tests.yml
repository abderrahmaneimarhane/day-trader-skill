name: Python tests

on:
  push:
    branches:
      - main
      - "v2/**"
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile Python
        run: python -m compileall -q mt5_openai tests
      - name: Install Python dependencies
        run: pip install -r mt5_openai/requirements.txt
      - name: Run offline tests
        run: python -m unittest discover -s tests -v
